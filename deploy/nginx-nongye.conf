# 农溯 / 安溯·知源 VeriTrace —— 80 端口全部反代到 Spring Boot（8081）
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # 与后端 multipart 上限一致
    client_max_body_size 50m;

    # 压缩：gzip_proxied 默认 off，反代响应不会压缩，必须显式开启
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml font/woff2;

    # 构建产物文件名带内容哈希，可长期缓存，二次访问直接命中浏览器缓存
    location /app/assets/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 清空 Accept-Encoding 交给 Nginx 统一压缩，避免后端压缩状态干扰
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        # AI 问答可能较慢，给足超时
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
